services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Tidak ada `ports:` — hanya service `app` yang perlu database, dan itu lewat
    # jaringan internal compose. Mem-publish port ini membuka Postgres ke internet.
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      POSTGRES_DB: hellens_scraper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Override agar menunjuk ke service compose (mengalahkan nilai di .env).
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}@db:5432/hellens_scraper?schema=public
      WA_PROVIDER: gateway
      WA_GATEWAY_BASE_URL: http://gateway:3001
      WA_GATEWAY_TOKEN: ${WA_GATEWAY_TOKEN:?WA_GATEWAY_TOKEN wajib diisi}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET wajib diisi}
      MEDIA_DIR: /app/media
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wa_sessions:/app/wa-sessions
      - media:/app/media
    expose:
      - "3000"

  worker:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && npm run worker"]
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD wajib diisi}@db:5432/hellens_scraper?schema=public
      WA_PROVIDER: gateway
      WA_GATEWAY_BASE_URL: http://gateway:3001
      WA_GATEWAY_TOKEN: ${WA_GATEWAY_TOKEN:?WA_GATEWAY_TOKEN wajib diisi}
    depends_on:
      db:
        condition: service_healthy
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs'); process.exit(Date.now()-fs.statSync('/tmp/gaetin-worker-health').mtimeMs < 30000 ? 0 : 1)"]
      interval: 15s
      start_period: 60s

  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      PORT: 3001
      GATEWAY_TOKEN: ${WA_GATEWAY_TOKEN:?WA_GATEWAY_TOKEN wajib diisi}
      WEBHOOK_URL: http://app:3000/api/whatsapp/webhook
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET wajib diisi}
      SESSION_DIR: /app/wa-sessions
      MEDIA_DIR: /app/media
    volumes:
      - wa_sessions:/app/wa-sessions
      - media:/app/media
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  wa_sessions:
  media:
  caddy_data:
  caddy_config:
