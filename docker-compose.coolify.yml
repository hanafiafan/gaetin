services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set a real random POSTGRES_PASSWORD in Coolify env vars}@db:5432/${POSTGRES_DB:-hellens_scraper}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set a real random POSTGRES_PASSWORD in Coolify env vars}@db:5432/${POSTGRES_DB:-hellens_scraper}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?set a real random JWT_SECRET in Coolify env vars}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://scraper.hellens.dev}
      - WA_SESSION_DIR=/app/wa-sessions
      - WA_PROVIDER=gateway
      - WA_GATEWAY_BASE_URL=http://gateway:3001
      - WA_GATEWAY_TOKEN=${JWT_SECRET}
      - WEBHOOK_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - wa_sessions:/app/wa-sessions
    ports:
      - "${APP_PORT:-3005}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.middlewares.scraper-redirect-scheme.redirectscheme.scheme=https"
      - "traefik.http.middlewares.scraper-redirect-scheme.redirectscheme.permanent=true"
      - "traefik.http.routers.scraper-http.entrypoints=http"
      - "traefik.http.routers.scraper-http.rule=Host(`scraper.hellens.dev`)"
      - "traefik.http.routers.scraper-http.middlewares=scraper-redirect-scheme"
      - "traefik.http.routers.scraper-http.service=scraper-svc"
      - "traefik.http.routers.scraper-https.entrypoints=https"
      - "traefik.http.routers.scraper-https.rule=Host(`scraper.hellens.dev`)"
      - "traefik.http.routers.scraper-https.service=scraper-svc"
      - "traefik.http.routers.scraper-https.tls=true"
      - "traefik.http.routers.scraper-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.scraper-svc.loadbalancer.server.port=3000"
    networks:
      - default
      - coolify

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3001
      - GATEWAY_TOKEN=${JWT_SECRET}
      - WEBHOOK_URL=http://app:3000/api/whatsapp/webhook
      - WEBHOOK_SECRET=${JWT_SECRET}
      - SESSION_DIR=/app/wa-sessions
    volumes:
      - wa_sessions:/app/wa-sessions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real random POSTGRES_PASSWORD in Coolify env vars}
      POSTGRES_DB: ${POSTGRES_DB:-hellens_scraper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hellens_scraper}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - default

volumes:
  pgdata:
  redis_data:
  wa_sessions:

networks:
  default:
  coolify:
    external: true
