services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-gaetin_secure_pass_2026}@db:5432/${POSTGRES_DB:-gaetin}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-gaetin_secure_pass_2026}@db:5432/${POSTGRES_DB:-gaetin}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-gaetin_secret_key_prod_vps_run_2026_x89a}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://gaetin.run-web.tech}
      - WA_SESSION_DIR=/app/wa-sessions
      - WA_PROVIDER=gateway
      - WA_GATEWAY_BASE_URL=http://gateway:3001
      - WA_GATEWAY_TOKEN=${JWT_SECRET:-gaetin_secret_key_prod_vps_run_2026_x89a}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - wa_sessions:/app/wa-sessions
    ports:
      - "${APP_PORT:-3005}:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.gaetin-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.gaetin-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.gaetin-http.entrypoints=http"
      - "traefik.http.routers.gaetin-http.rule=Host(`gaetin.run-web.tech`)"
      - "traefik.http.routers.gaetin-http.middlewares=gaetin-redirect"
      - "traefik.http.routers.gaetin-http.service=app"
      - "traefik.http.routers.gaetin-https.entrypoints=https"
      - "traefik.http.routers.gaetin-https.rule=Host(`gaetin.run-web.tech`)"
      - "traefik.http.routers.gaetin-https.service=app"
      - "traefik.http.routers.gaetin-https.tls=true"
      - "traefik.http.routers.gaetin-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
    networks:
      - default
      - coolify

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3001
      - GATEWAY_TOKEN=${JWT_SECRET:-gaetin_secret_key_prod_vps_run_2026_x89a}
      - WEBHOOK_URL=http://app:3000/api/whatsapp/webhook
      - WEBHOOK_SECRET=${JWT_SECRET:-gaetin_secret_key_prod_vps_run_2026_x89a}
      - SESSION_DIR=/app/wa-sessions
    volumes:
      - wa_sessions:/app/wa-sessions
    networks:
      - default

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gaetin_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-gaetin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gaetin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - default

volumes:
  pgdata:
  redis_data:
  wa_sessions:

networks:
  default:
  coolify:
    external: true
